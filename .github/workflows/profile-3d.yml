# Generates the 3D contribution calendar (light + dark, in the profile's brand colour)
# and publishes it to the `profile-3d` branch, so the README never depends on an outside server.
name: 3D contribution calendar

on:
  schedule:
    - cron: "37 0 * * *" # daily, around 02:37–03:37 Helsinki time
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    paths: # runs as soon as either file is committed or changed
      - ".github/workflows/profile-3d.yml"
      - ".github/profile-3d-settings.json"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v7

      - name: Generate the 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Publish to the profile-3d branch
        working-directory: profile-3d-contrib
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s profile-3d-light.svg && test -s profile-3d-dark.svg
          git init -q -b profile-3d
          git add profile-3d-light.svg profile-3d-dark.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update 3D contribution calendar"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" profile-3d
