# Keeps the GitHub Actions used by this profile's workflows up to date.
# Once a week, Dependabot opens one pull request bundling any available updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Helsinki"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
